<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07110f" />
    <title>ProofBounty · Wallet deployer</title>
    <style>
      :root{color-scheme:dark;--bg:#07110f;--panel:#0d1916;--line:#294039;--ink:#f3f8f6;--muted:#8ca099;--cyan:#62f4d2;--yellow:#e9ff78;--bad:#ff8f8f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(98,244,210,.12),transparent 35%),var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(760px,100%);border:1px solid var(--line);background:rgba(13,25,22,.96);box-shadow:0 24px 70px rgba(0,0,0,.35)}header,main{padding:28px 32px}header{border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 8px;color:var(--cyan);font:700 .75rem ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.8rem,5vw,3.1rem);letter-spacing:-.055em}p{color:var(--muted)}.warning{border-left:3px solid var(--yellow);padding:12px 16px;background:#101d19;color:#c8d5d0}.actions{display:flex;gap:12px;margin:24px 0}button{border:0;border-radius:7px;padding:13px 18px;font-weight:800;cursor:pointer;background:var(--cyan);color:var(--bg)}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.details{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:20px 0}.details div{padding:16px;border-bottom:1px solid var(--line)}.details div:nth-child(odd){border-right:1px solid var(--line)}.details span,.details strong{display:block}.details span{font-size:.78rem;color:var(--muted);margin-bottom:5px}.details strong{font-family:ui-monospace,monospace;font-size:.88rem;overflow-wrap:anywhere}.status{padding:12px 14px;background:#081310;border:1px solid var(--line)}.status[data-tone=good]{border-color:var(--cyan);color:var(--cyan)}.status[data-tone=bad]{border-color:var(--bad);color:var(--bad)}.result{margin-top:20px;padding:16px;border:1px solid var(--cyan)}.result p{color:var(--ink);font-weight:800}.result a{display:block;color:var(--cyan);overflow-wrap:anywhere;margin-top:8px}textarea{width:100%;min-height:180px;margin-top:16px;padding:14px;background:#06100d;color:var(--cyan);border:1px solid var(--line);font:13px/1.5 ui-monospace,monospace;resize:vertical}@media(max-width:600px){header,main{padding:22px}.actions{flex-direction:column}.details{grid-template-columns:1fr}.details div:nth-child(odd){border-right:0}}
    </style>
  </head>
  <body>
    <section class="shell">
      <header><p class="eyebrow">Arc Mainnet · Chain 5042</p><h1>Deploy ProofBounty</h1></header>
      <main>
        <p class="warning">This page uses your browser wallet. It never asks for, reads, or stores your private key. Verify the selected account before approving.</p>
        <div class="actions"><button id="connect">Connect wallet</button><button id="deploy" class="secondary" disabled>Deploy contract</button></div>
        <div id="status" class="status">Connect a dedicated low-balance wallet to begin.</div>
        <div id="details" class="details" hidden></div>
        <div id="result" class="result" hidden></div>
        <textarea id="config-output" aria-label="Generated web configuration" readonly hidden></textarea>
        <button id="copy-config" class="secondary" hidden>Copy web config</button>
      </main>
    </section>
    <script type="module" src="./deploy.bundle.js"></script>
  </body>
</html>
